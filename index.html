<html lang="en">

<title>BIZVISU — See. Understand. Decide. Grow.</title>
<style>
:root{
  --bg:#f4f6f8;--surface:#fff;--surface2:#eef2f5;--ink:#0e1b2b;--ink2:#3b4a5c;--ink3:#687789;
  --line:#dce3ea;--brand:#0b6e78;--brand2:#e2f1f2;--brandInk:#fff;
  --crit:#b42318;--critBg:#fdecea;--attn:#9a4a06;--attnBg:#fff1df;--opp:#087044;--oppBg:#e4f5ec;--info:#1d5ab8;--infoBg:#e7effc;
  --shadow:0 8px 28px rgba(14,27,43,.07);--r:14px;--font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif
}
[data-theme=dark]{--bg:#0b141f;--surface:#14202f;--surface2:#1b2a3c;--ink:#e9eef4;--ink2:#b8c5d3;--ink3:#93a3b6;--line:#293a4d;--brand:#4fc3cb;--brand2:#12323a;--brandInk:#04242a;--shadow:0 8px 28px rgba(0,0,0,.28)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:var(--font);background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);padding:18px 14px;display:flex;flex-direction:column;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:8px 10px 20px}.logo{width:38px;height:38px;border-radius:11px;background:var(--brand);display:grid;place-items:center;color:var(--brandInk);font-weight:800;font-size:20px}.brand strong{font-size:18px;letter-spacing:.12em}.brand small{display:block;color:var(--ink3);font-size:10px;letter-spacing:.08em}
.nav{display:grid;gap:3px;overflow:auto}.nav button{border:0;background:transparent;color:var(--ink2);text-align:left;padding:10px 12px;border-radius:10px;display:flex;align-items:center;gap:11px}.nav button:hover,.nav button.active{background:var(--brand2);color:var(--brand);font-weight:650}.nav svg{width:18px;height:18px;flex:none}.nav-sep{margin:12px 8px 5px;color:var(--ink3);font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.side-bottom{margin-top:auto;display:grid;gap:8px}.userbox{padding:11px;border:1px solid var(--line);border-radius:12px}.userbox b{display:block;font-size:13px}.userbox span{font-size:11px;color:var(--ink3)}
.main{min-width:0}.topbar{height:68px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:15}.search{flex:1;max-width:520px;position:relative}.search input{width:100%;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:10px;padding:10px 13px 10px 38px;outline:none}.search input:focus{border-color:var(--brand)}.search .glass{position:absolute;left:13px;top:11px;color:var(--ink3)}.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}.active-role-pill{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;cursor:pointer;max-width:190px}.active-role-pill b{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.active-role-pill span{font-size:9px;color:var(--ink3);display:block;white-space:nowrap}.iconbtn,.avatar{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;display:grid;place-items:center}.avatar{background:var(--brand);color:var(--brandInk);border-color:var(--brand);font-weight:700}
.content{padding:26px;max-width:1600px;margin:auto}.pagehead{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px}.eyebrow{color:var(--brand);font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:750}.pagehead h1{margin:4px 0 4px;font-size:29px;letter-spacing:-.03em}.pagehead p{margin:0;color:var(--ink2)}.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 13px;border-radius:9px}.btn:hover{border-color:var(--brand)}.btn.primary{background:var(--brand);color:var(--brandInk);border-color:var(--brand)}.btn.danger{color:var(--crit)}.btn.small{padding:6px 9px;font-size:12px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}.card h3{margin:0 0 12px;font-size:15px}.muted{color:var(--ink3)}.num{font-variant-numeric:tabular-nums}.kpi{padding:15px}.kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);font-weight:700}.kpi .value{font-size:26px;font-weight:750;margin:5px 0}.delta{font-size:12px;font-weight:700}.good{color:var(--opp)}.bad{color:var(--crit)}.neutral{color:var(--ink2)}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:24px 0 11px}.section-title h2{font-size:18px;margin:0}.section-title span{font-size:12px;color:var(--ink3)}
.pulse{display:grid;grid-template-columns:190px 1fr;gap:22px;align-items:center}.score{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:auto;background:conic-gradient(var(--brand) calc(var(--score)*1%),var(--surface2) 0);position:relative}.score:after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--surface)}.score .inside{position:relative;z-index:1;text-align:center}.score strong{font-size:40px;display:block}.score small{color:var(--ink3)}
.bars{display:grid;gap:9px}.barrow{display:grid;grid-template-columns:125px 1fr 40px;gap:9px;align-items:center;font-size:12px}.bar{height:8px;border-radius:9px;background:var(--surface2);overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:inherit}
.alert{border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:11px;padding:13px;background:var(--surface);display:grid;gap:6px}.alert.critical{border-left-color:var(--crit);background:linear-gradient(90deg,var(--critBg),var(--surface) 35%)}.alert.attention{border-left-color:var(--attn);background:linear-gradient(90deg,var(--attnBg),var(--surface) 35%)}.alert.opportunity{border-left-color:var(--opp);background:linear-gradient(90deg,var(--oppBg),var(--surface) 35%)}.alert h4{margin:0;font-size:14px}.alert p{margin:0;color:var(--ink2);font-size:13px}.alert .meta{font-size:11px;color:var(--ink3)}
.chart{height:240px;width:100%;overflow:hidden}.chart svg{width:100%;height:100%}.chart text{fill:var(--ink3);font-size:10px}.chart .axis{stroke:var(--line)}.chart .line{fill:none;stroke:var(--brand);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.chart .area{fill:var(--brand);opacity:.1}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:12.5px}th{background:var(--surface2);color:var(--ink3);font-size:10px;text-transform:uppercase;letter-spacing:.06em}tr:last-child td{border-bottom:0}td.right,th.right{text-align:right}.pill{display:inline-flex;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:700;background:var(--surface2);color:var(--ink2)}.pill.good{background:var(--oppBg);color:var(--opp)}.pill.bad{background:var(--critBg);color:var(--crit)}.pill.attn{background:var(--attnBg);color:var(--attn)}.pill.info{background:var(--infoBg);color:var(--info)}
.ai{display:grid;grid-template-columns:1fr 240px;gap:15px}.ai-box{min-height:170px;border:1px solid var(--line);border-radius:11px;padding:15px;background:var(--surface2)}.ai-q{display:flex;gap:8px;margin-top:10px}.ai-q input{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:10px}.suggestions{display:grid;gap:7px}.suggestions button{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink2);padding:8px;border-radius:8px;font-size:11px}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.field label{font-size:11px;font-weight:700;color:var(--ink2)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:9px;outline:none}.field textarea{min-height:85px}.field input:focus,.field select:focus{border-color:var(--brand)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:15px;overflow:auto}.tabs button{border:0;background:transparent;color:var(--ink2);padding:9px 12px;border-bottom:2px solid transparent;white-space:nowrap}.tabs button.active{color:var(--brand);border-color:var(--brand);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal.open{display:flex}.modalbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:min(720px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 90px rgba(0,0,0,.25);padding:20px}.modalhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.modalhead h2{margin:0;font-size:20px}.close{border:0;background:transparent;color:var(--ink2);font-size:24px}
.toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:var(--bg);padding:11px 14px;border-radius:10px;display:none;z-index:200;box-shadow:var(--shadow);font-size:13px}.toast.show{display:block}
.mobile-nav{display:none}.empty{padding:38px;text-align:center;color:var(--ink3)}.empty strong{display:block;color:var(--ink);margin-bottom:5px}.hidden{display:none!important}
.login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:300}.loginbox{width:min(440px,calc(100% - 30px));background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}.loginbox .logo{margin-bottom:15px}.loginbox h1{margin:0 0 7px}.loginbox p{color:var(--ink2);font-size:13px}.demo-note{margin:16px 0;padding:12px;background:var(--brand2);border-radius:10px;color:var(--ink2);font-size:12px}
.search-results{position:absolute;top:46px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:7px;display:none;z-index:40}.search-results.open{display:block}.result{padding:9px;border-radius:7px}.result:hover{background:var(--surface2)}
@media(max-width:1100px){.app{grid-template-columns:76px 1fr}.sidebar{padding:12px 9px}.brand{justify-content:center}.brand div:last-child,.nav button span,.nav-sep,.userbox{display:none}.nav button{justify-content:center}.g6{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){.app{display:block}.sidebar{display:none}.topbar{height:60px;padding:0 12px}.content{padding:18px 13px 85px}.pagehead{display:block}.head-actions{margin-top:12px}.g2,.g3,.g4{grid-template-columns:1fr}.g6{grid-template-columns:repeat(2,1fr)}.pulse{grid-template-columns:1fr}.ai{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:65px;background:var(--surface);border-top:1px solid var(--line);z-index:30;justify-content:space-around}.mobile-nav button{border:0;background:transparent;color:var(--ink3);font-size:10px;display:grid;place-items:center;gap:2px}.mobile-nav button.active{color:var(--brand);font-weight:700}.mobile-nav svg{width:19px}.formgrid{grid-template-columns:1fr}.search{max-width:none}.top-actions .hide-sm{display:none}}

/* Stage 4 — Product Image Library */
.image-library-shell{overflow:hidden}.image-upload-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}.image-action{border:1px dashed var(--line);background:var(--surface2);border-radius:12px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;color:var(--ink);min-height:110px}.image-action:hover{border-color:var(--brand);background:var(--brand2)}.image-action span{font-size:24px;color:var(--brand);font-weight:800}.image-action small{color:var(--ink3)}.image-filter-row{display:flex;gap:6px;overflow:auto;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px}.image-filter{border:0;background:transparent;color:var(--ink2);padding:8px 12px;border-radius:9px;white-space:nowrap;cursor:pointer}.image-filter.active{background:var(--brand2);color:var(--brand);font-weight:700}.image-lib-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.image-lib-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}.image-lib-photo{height:170px;background:var(--surface2);position:relative}.image-lib-photo img{width:100%;height:100%;object-fit:cover;display:block}.image-tag{position:absolute;left:8px;bottom:8px;padding:4px 8px;border-radius:999px;background:var(--surface);font-size:11px;font-weight:800;box-shadow:var(--shadow)}.image-tag.product{color:var(--info)}.image-tag.packaging{color:var(--opp)}.image-tag.inbound{color:var(--attn)}.image-tag.outbound{color:#6b3cc5}.image-tag.damage{color:var(--crit)}.image-tag.pod{color:var(--brand)}.image-more{position:absolute;right:8px;top:8px;width:28px;height:28px;border:0;border-radius:50%;background:rgba(255,255,255,.92);cursor:pointer;font-size:18px}.image-lib-meta{padding:10px;display:flex;flex-direction:column;gap:4px}.image-lib-meta b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.image-lib-meta span{font-size:11px;color:var(--ink3)}.image-empty{text-align:center;padding:42px 20px;color:var(--ink2)}.image-empty>div{font-size:42px;color:var(--brand);margin-bottom:8px}.image-empty h3{margin:0 0 5px;color:var(--ink)}.image-library-note{margin-top:14px;padding:12px 14px;background:var(--surface2);border-radius:10px;color:var(--ink2);font-size:12px}.image-library-note b{color:var(--ink)}
@media(max-width:900px){.image-upload-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.image-lib-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.image-lib-photo{height:145px}}
@media(max-width:560px){.image-upload-grid,.image-lib-grid{grid-template-columns:1fr}.image-lib-photo{height:210px}}

.auth-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.permission-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.permission-grid label{display:flex;gap:7px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:12px}.user-status{font-size:11px;padding:4px 8px;border-radius:999px;background:var(--brand2);color:var(--brand)}.security-note{padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);font-size:12px;color:var(--ink2)}@media(max-width:700px){.auth-grid,.permission-grid{grid-template-columns:1fr}}

.analytics-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.analytics-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}.analytics-card h3{margin:0 0 6px;font-size:14px}.analytics-value{font-size:25px;font-weight:800}.editable-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.edit-field label{display:block;font-size:11px;color:var(--ink3);margin-bottom:5px}.edit-field input,.edit-field select{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}.chart-wrap{height:270px;padding:8px 0}.biz-chart{width:100%;height:100%;overflow:visible}.chart-grid{stroke:var(--line);stroke-width:1}.chart-line{fill:none;stroke:var(--brand);stroke-width:3}.chart-dot{fill:var(--brand)}.chart-label{font-size:10px;fill:var(--ink3)}.analysis-tabs{display:flex;gap:7px;flex-wrap:wrap}.analysis-tabs button{border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:999px;cursor:pointer}.analysis-tabs button.active{background:var(--brand2);color:var(--brand);border-color:var(--brand)}@media(max-width:900px){.analytics-grid,.editable-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.analytics-grid,.editable-grid{grid-template-columns:1fr}}
</style>
<style id="bizvisu-subscription-css">

</style>

.bv-login-logo{display:block;width:112px;height:112px;object-fit:cover;border-radius:24px;margin:0 auto 14px}

</style>
<style id="bizvisu-cheque-css">.cheque-module{margin:24px 0}.cheque-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.cheque-card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px}.cheque-card b{font-size:20px}.cheque-status{display:inline-block;padding:4px 9px;border-radius:999px;font-size:12px;background:#eef2ff}.cheque-table{width:100%;border-collapse:collapse}.cheque-table th,.cheque-table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.cheque-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.cheque-form input,.cheque-form select{padding:10px;border:1px solid #d9dee7;border-radius:8px}.cheque-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}</style><style id="bizvisu-master-polish">
:root{--bv-teal:#087f87;--bv-navy:#0b1f33;--bv-cyan:#12b7d4;--bv-gold:#e7a93b}
.login-card{position:relative;overflow:hidden}

.master-cred-head,.master-cred-row{display:grid;grid-template-columns:1.15fr 1.6fr auto;gap:12px;align-items:center}
.master-cred-head{padding:8px 12px;color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.master-cred-row{padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--surface)}
.master-cred-row span{display:block;color:#64748b;font-size:11px;margin-top:2px}
.master-cred-code{display:flex;gap:7px;flex-wrap:wrap}.master-cred-code code{background:var(--surface2);border:1px solid var(--line);padding:5px 7px;border-radius:7px;font-size:11px}
.bv-exec-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}
.bv-exec-card{border:1px solid var(--line);background:linear-gradient(135deg,var(--surface),var(--surface2));border-radius:16px;padding:16px;position:relative;overflow:hidden}

.bv-exec-card h3{margin:5px 0 4px}.bv-exec-card p{margin:0;color:var(--ink3);font-size:12px;line-height:1.45}

function openDemoLogin(){openModalHtml(`<div class="modalhead"><h2>Demo accounts</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Prototype credentials are shown for demonstration only. Production passwords must never be stored in HTML.</p>${state.users.map(u=>`<div class="card" style="margin:8px 0;padding:11px"><b>${u.name}</b><div class="muted" style="font-size:11px">${u.email} · ${roles[u.role]?.label||u.role} · ${u.department}</div><button class="btn small" style="margin-top:7px" onclick="fillDemo('${u.email}','${u.password}')">Use account</button></div>`).join("")}`)}
function fillDemo(email,password){closeModal();document.getElementById("loginId").value=email;document.getElementById("loginPassword").value=password;document.getElementById("loginError").style.display="none"}
function loginUser(){
  const id=(document.getElementById("loginId")?.value||"").trim().toLowerCase();
  const pw=document.getElementById("loginPassword")?.value||"";
  const u=state.users.find(x=>(x.email||"").toLowerCase()===id&&x.password===pw);
  if(!u){
    const exists=state.users.some(x=>(x.email||"").toLowerCase()===id);
    showLoginError(exists?"Incorrect password. Use Forgot Password or try again.":"No account found for this login ID. Create an account or use View Demo Accounts.");
    return;
  }
  if(u.status!=="Active"){showLoginError("This user account is inactive. Contact the company administrator.");return;}
  state.logged=true; state.currentUserId=u.id; state.role=u.role; state.branch=u.branch;
  u.lastLogin=new Date().toISOString().slice(0,16).replace("T"," ");
  state.audit=state.audit||[]; state.audit.unshift({at:new Date().toISOString(),user:u.name,action:"Login",target:u.email});
  save(); document.getElementById("login").style.display="none"; document.getElementById("app").style.display="grid"; renderNav(); openPage("command"); toast("Welcome, "+u.name);
}
function openSignup(){
  const name=prompt("Full name:"); if(!name) return;
  const email=(prompt("Work email / Login ID:")||"").trim().toLowerCase();
  if(!email || !email.includes("@")){alert("Enter a valid email/login ID.");return;}
  if(state.users.some(x=>(x.email||"").toLowerCase()===email)){alert("An account with this login ID already exists.");return;}
  const pw=prompt("Create password (minimum 8 characters):")||"";
  if(pw.length<8){alert("Password must contain at least 8 characters.");return;}
  const id="U"+String(Date.now()).slice(-8);
  state.users.push({id,name,email,password:pw,department:"General",designation:"Employee",role:"EMP",branch:"Branch A",manager:"BIZVISU Admin",status:"Active",lastLogin:"—"});
  save(); document.getElementById("loginId").value=email; document.getElementById("loginPassword").value=pw;
  alert("Account created successfully. You can now sign in.");
}
function forgotLogin(){
  const email=(document.getElementById("loginId")?.value||prompt("Enter your login email:")||"").trim().toLowerCase();
  const u=state.users.find(x=>(x.email||"").toLowerCase()===email);
  if(!u){alert("No account found for that login ID.");return;}
  const pw=prompt("Prototype password reset: enter a new password (minimum 8 characters):")||"";
  if(pw.length<8){alert("Password must contain at least 8 characters.");return;}
  u.password=pw; save(); document.getElementById("loginPassword").value=pw; alert("Password updated for this prototype. In production this must use a secure reset link/email flow.");
}

function enterApp(){const u=state.users?.find(x=>x.role==="CEO")||state.users?.[0];if(u){document.getElementById("loginId").value=u.email;document.getElementById("loginPassword").value=u.password;loginUser()}}
function logout(){state.logged=false;state.currentUserId=null;save();document.getElementById("app").style.display="none";document.getElementById("login").style.display="grid";document.getElementById("loginPassword").value=""}

function renderNav(){

function openPage(page){
 if(!roles[state.role].access.includes(page)){toast("Permission denied for this role.");return}
 document.querySelectorAll(".nav button,.mobile-nav button").forEach(b=>b.classList.remove("active"));document.getElementById("n-"+page)?.classList.add("active");document.getElementById("m-"+page)?.classList.add("active");

function head(kicker,title,sub,actions=""){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${sub}</p></div><div class="head-actions">${actions}</div></div>`}
function kpi(label,value,change,cls="good"){return `<div class="card kpi"><div class="label">${label}</div><div class="value num">${value}</div><div class="delta ${cls}">${change}</div></div>`}
function lineChart(values,labels=[]){let w=700,h=220,p=25,min=Math.min(...values)*.85,max=Math.max(...values)*1.08;let pts=values.map((v,i)=>{let x=p+i*(w-2*p)/(values.length-1),y=h-p-(v-min)/(max-min)*(h-2*p);return [x,y]});let d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");let area=d+" L "+pts.at(-1)[0]+" "+(h-p)+" L "+pts[0][0]+" "+(h-p)+" Z";return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line class="axis" x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}"/><path class="area" d="${area}"/><path class="line" d="${d}"/>${pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="3" fill="var(--brand)"/>`).join("")}${labels.map((x,i)=>`<text x="${pts[i][0]}" y="${h-7}" text-anchor="middle">${x}</text>`).join("")}</svg>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`}
function row(cells){return `<tr>${cells.map(x=>`<td>${x}</td>`).join("")}</tr>`}
function statusPill(status){const c=status==="Overdue"?"bad":status==="Pending"?"attn":"good";return `<span class="pill ${c}">${status}</span>`}

pages.users=function(){

 const us=state.users||[];
 const userRows=us.map(function(u){

   const action='<button class="btn small" onclick="openUserEditor(\''+u.id+'\')">Edit</button> <button class="btn small" onclick="toggleUser(\''+u.id+'\')">'+(u.status==="Active"?"Disable":"Activate")+'</button>';

 '<div class="grid g4">'+kpi("Total Users",us.length,"Individual accounts","neutral")+kpi("Active Users",us.filter(x=>x.status==="Active").length,"Access enabled","good")+kpi("Departments",new Set(us.map(x=>x.department)).size,"Assigned departments","neutral")+kpi("Branches",new Set(us.map(x=>x.branch)).size,"Data scopes","neutral")+'</div>'+

 '<div class="card" style="margin-top:14px"><h3>Access & Security Checklist</h3><div class="grid g3"><div>🔐 Individual credentials<br><span class="muted">No shared department passwords</span></div><div>🛡️ Role-based permissions<br><span class="muted">View / Create / Edit / Delete / Approve / Export</span></div><div>📋 Audit trail<br><span class="muted">Login and important actions</span></div><div>🏢 Branch scope<br><span class="muted">Own / Branch / Company</span></div><div>🔄 Session control<br><span class="muted">Logout and future server-side session expiry</span></div><div>🔑 2FA-ready<br><span class="muted">Recommended for Admin / Enterprise</span></div></div></div>';

function updateAssumption(key,value){

 const n=Number(value); if(!Number.isFinite(n)||n<0){toast("Enter a valid non-negative number.");return;}
 state.assumptions[key]=n; save(); toast("Assumption updated");
}

function aiPanel(full=false){return `<div class="card ai"><div><h3>What can I help you understand?</h3><div class="ai-box" id="aiAnswer"><div class="muted">Try a question such as “Why did profit change?”, “Who owes us money?”, or “What is driving expenses?”</div></div><div class="ai-q"><input id="aiInput" placeholder="Ask a business question..." onkeydown="if(event.key==='Enter')askAI()"><button class="btn primary" onclick="askAI()">Ask</button></div></div><div><h3>Suggested questions</h3><div class="suggestions">${["Why did profit change?","Who owes us money?","What is driving expenses?","Which products have strong margins?","What needs attention today?"].map(q=>`<button onclick="document.getElementById('aiInput').value='${q}';askAI()">${q}</button>`).join("")}</div></div></div>`}
function askAI(){
 const q=(document.getElementById("aiInput")?.value||"").toLowerCase();let ans="";
 if(!q)return;
 if(q.includes("profit"))ans=`<b>Net profit is ${money(totals().np)}, up 8.7% versus the prior period.</b><br><br>Revenue grew 14.2%, while gross profit grew 11.6%. The main pressure is raw-material cost, up 18.4%, which reduced gross margin to 32.5%.<br><br><span class="muted">Data used: sales invoices, expense records and purchase costs.</span>`;
 else if(q.includes("owe")||q.includes("receivable"))ans=`<b>Receivables are ${money(totals().rec)}; ${money(totals().overdue)} is overdue.</b><br><br>The highest balances currently needing attention are ${state.customers.slice(0,3).map(c=>c.name+" ("+money(c.balance)+")").join(", ")}.<br><br><span class="muted">Next action: review overdue invoices and prepare collection reminders.</span>`;
 else if(q.includes("expense")||q.includes("cost"))ans=`<b>Raw materials are the largest cost pressure.</b><br><br>Raw materials +18.4%, Transport +9.2%, Utilities +14.1%, Administration −3.4%. The raw-material movement is the strongest contributor to margin pressure.<br><br><span class="muted">Data used: expense records and purchase invoices.</span>`;
 else if(q.includes("product")||q.includes("margin"))ans=`<b>Product-level margin analysis is available in the demo dataset.</b><br><br>One named product improved margin by 7.2 percentage points, while company gross margin is 32.5%. Review mix, supplier costs and selling price together before scaling the highest-growth products.`;
 else if(q.includes("attention")||q.includes("today"))ans=`<b>Three priorities stand out:</b><br><br>1. Collect ${money(totals().overdue)} overdue receivables.<br>2. Investigate the +18.4% raw-material cost movement.<br>3. Capture the sales-growth opportunity while protecting margin.`;
 else ans=`<b>I can answer from the available BIZVISU demo data, but I do not have enough evidence for that exact question.</b><br><br>Try asking about profit, receivables, expenses, product margins, sales or current attention items.`;
 document.getElementById("aiAnswer").innerHTML=ans;state.audit.push({time:new Date().toISOString(),role:state.role,action:"AI_QUERY",question:q});save()
}

function openModal(type){let title="",body="";
 const fields={invoice:[["Customer","customer"],["Amount","amount"]],expense:[["Expense head","head"],["Amount","amount"]],purchase:[["Supplier","supplier"],["Amount","amount"]],customer:[["Customer name","name"],["Segment","segment"],["Region","region"]],supplier:[["Supplier name","name"],["Category","category"]],stock:[["Product","product"],["Quantity","qty"]]};
 title={invoice:"Add Sale",expense:"Add Expense",purchase:"Add Purchase Order",customer:"Add Customer",supplier:"Add Supplier",stock:"Stock Adjustment"}[type];

 openModalHtml(`<div class="modalhead"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div><div class="formgrid">${body}</div><button class="btn primary" style="margin-top:16px" onclick="addRecord('${type}')">Save record</button>`)
}
function addRecord(type){
 const val=k=>document.getElementById("f-"+k)?.value.trim();let ok=true;
 if(type==="invoice"){state.invoices.push({id:"INV-"+(1001+state.invoices.length),date:new Date().toISOString().slice(0,10),customer:val("customer")||"New Customer",amount:+val("amount")||0,status:"Unpaid"})}
 if(type==="expense"){state.expenses.push({id:"EXP-"+(2001+state.expenses.length),date:new Date().toISOString().slice(0,10),head:val("head")||"Other",amount:+val("amount")||0,kind:"Indirect"})}
 if(type==="purchase"){state.purchases.push({id:"PO-"+(3001+state.purchases.length),date:new Date().toISOString().slice(0,10),supplier:val("supplier")||"New Supplier",amount:+val("amount")||0,status:"Pending Approval"})}
 if(type==="customer")state.customers.push({id:"C"+(state.customers.length+1),name:val("name")||"New Customer",segment:val("segment")||"SME",region:val("region")||"Tamil Nadu",balance:0});
 if(type==="supplier")state.suppliers.push({id:"S"+(state.suppliers.length+1),name:val("name")||"New Supplier",category:val("category")||"General",balance:0});
 if(type==="stock"){let p=state.products.find(p=>p.name.toLowerCase().includes((val("product")||"").toLowerCase()));if(p)p.qty+=Number(val("qty")||0);else ok=false}
 if(ok){save();closeModal();toast("Record saved successfully");openPage(type==="invoice"?"sales":type==="expense"?"finance":type==="purchase"?"purchases":type==="customer"?"customers":type==="supplier"?"suppliers":"inventory")}else toast("Could not find that product")
}

    const fields=kind==='inbound'
      ?[['freight','Freight'],['loading','Loading'],['unloading','Unloading'],['insurance','Insurance'],['other','Other inbound cost']]
      :[['transport','Transport'],['packaging','Packaging'],['loading','Loading'],['delivery','Last-mile delivery'],['other','Other outbound cost']];
    const body=`<div class="form-grid">${fields.map(f=>`<label>${f[1]}<input type="number" min="0" step="1" id="s5-${f[0]}" value="${+d[f[0]]||0}"></label>`).join('')}</div><p class="muted" style="margin-top:10px">${kind==='inbound'?'These costs build the landed cost of stock.':'These costs are deducted from sales contribution to calculate true profit.'}</p><div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveStage5Costs('${kind}','${id}')">Save Costs</button></div>`;
    openModalHtml(kind==='inbound'?'Edit Inbound Landed Cost':'Edit Outbound Distribution Cost',body);
  }
  function saveStage5Costs(kind,id){
    const fields=kind==='inbound'?['freight','loading','unloading','insurance','other']:['transport','packaging','loading','delivery','other'];
    const d={};fields.forEach(f=>d[f]=Math.max(0,Number(document.getElementById('s5-'+f)?.value||0)));
    state.logistics.costDetails[kind][id]=d;save();closeModal();toast('Logistics cost updated. True profit recalculated.');openPage('inventory');
  }
  function stage5AddCostRecord(kind){
    const options=kind==='inbound'?state.logistics.inbound:state.logistics.outbound;
    if(!options.length){toast('No logistics records available.');return}
    stage5CostModal(kind,options[0].id);
  }
  function stage5InventorySection(){
    const t=stage5Totals(), rows=state.products.map((p,i)=>({p,r:stage5ProductFinancials(p,i)}));
    const high=rows.filter(z=>z.r.revenue&&z.r.outboundCost/z.r.revenue>.05).length;

      <div class="grid g6"><div class="card kpi"><div class="label">Sales Revenue</div><div class="value num">${money(t.revenue)}</div><div class="delta good">Recorded product sales</div></div><div class="card kpi"><div class="label">Base COGS</div><div class="value num">${money(t.baseCogs)}</div><div class="delta neutral">Purchase cost only</div></div><div class="card kpi"><div class="label">Inbound Landed Cost</div><div class="value num">${money(t.inbound)}</div><div class="delta bad">Freight + handling + insurance</div></div><div class="card kpi"><div class="label">Outbound Cost</div><div class="value num">${money(t.outbound)}</div><div class="delta bad">Transport + packaging + delivery</div></div><div class="card kpi"><div class="label">True COGS</div><div class="value num">${money(t.trueCogs)}</div><div class="delta neutral">COGS including inbound landed cost</div></div><div class="card kpi"><div class="label">True Profit</div><div class="value num">${money(t.profit)}</div><div class="delta ${t.profit>=0?'good':'bad'}">${trueMargin.toFixed(1)}% true margin</div></div></div>
      <div class="grid g3" style="margin-top:14px"><div class="card"><div class="eyebrow">LOGISTICS COST SHARE</div><h2>${t.revenue?( (t.inbound+t.outbound)/t.revenue*100).toFixed(1):'0.0'}%</h2><p class="muted">Total logistics cost as a percentage of revenue.</p></div><div class="card"><div class="eyebrow">HIGH LOGISTICS PRODUCTS</div><h2>${high}</h2><p class="muted">Products where outbound cost exceeds 5% of sales.</p></div><div class="card"><div class="eyebrow">LOW MARGIN PRODUCTS</div><h2>${low}</h2><p class="muted">Products below 15% true contribution margin.</p></div></div>
      <div class="section-title"><h3>Product True Profitability</h3><span>Profit after landed cost and outbound logistics</span></div>
      <div class="table-wrap"><table><thead><tr><th>Product</th><th>Units Sold</th><th>Revenue</th><th>Landed Unit Cost</th><th>True COGS</th><th>Inbound Cost</th><th>Outbound Cost</th><th>True Profit</th><th>Margin</th><th>Action</th></tr></thead><tbody>${rows.map(z=>`<tr><td><b>${z.p.name}</b><br><span class="muted">${z.p.sku}</span></td><td>${z.r.sold}</td><td>${money(z.r.revenue)}</td><td>${money(z.r.landedUnitCost)}</td><td>${money(z.r.trueCogs)}</td><td>${money(z.r.inboundCost)}</td><td>${money(z.r.outboundCost)}</td><td><b>${money(z.r.trueProfit)}</b></td><td>${stage5Badge(z.r.margin)} <span class="muted">${z.r.margin.toFixed(1)}%</span></td><td><button class="btn sm" onclick="stage5ProductDrill('${z.p.id}')">Explain</button></td></tr>`).join('')}</tbody></table></div>
      <div class="grid g2" style="margin-top:14px"><div class="card"><div class="section-title" style="margin-top:0"><h3>Inbound Cost Breakdown</h3><span>What builds landed cost</span></div>${rows.map(z=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span>${z.p.name}</span><b>${money(z.r.inboundCost)}</b></div>`).join('')}</div><div class="card"><div class="section-title" style="margin-top:0"><h3>Outbound Cost Breakdown</h3><span>What reduces contribution</span></div>${rows.map(z=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span>${z.p.name}</span><b>${money(z.r.outboundCost)}</b></div>`).join('')}</div></div>
      <div class="alert-box attention" style="margin-top:14px"><b>Next Best Action:</b> ${low?`Review ${low} low-margin product${low>1?'s':''} before increasing sales volume.`:high?`Review ${high} high-logistics product${high>1?'s':''} and compare transporters.`:'Current recorded product margins are healthy. Keep monitoring landed and delivery costs.'}</div>
    </div>`;
  }
  function stage5ProductDrill(id){
    const i=state.products.findIndex(p=>p.id===id), p=state.products[i]; if(!p)return;
    const r=stage5ProductFinancials(p,i);
    const body=`<div class="grid g3"><div class="card"><div class="eyebrow">REVENUE</div><h2>${money(r.revenue)}</h2></div><div class="card"><div class="eyebrow">TRUE COGS</div><h2>${money(r.trueCogs)}</h2></div><div class="card"><div class="eyebrow">TRUE PROFIT</div><h2>${money(r.trueProfit)}</h2></div></div><div class="table-wrap" style="margin-top:12px"><table><tbody><tr><th>Base unit cost</th><td>${money(p.cost)}</td></tr><tr><th>Inbound landed cost / unit</th><td>${money(r.avgInboundPerUnit)}</td></tr><tr><th>True landed unit cost</th><td>${money(r.landedUnitCost)}</td></tr><tr><th>Outbound logistics</th><td>${money(r.outboundCost)}</td></tr><tr><th>True margin</th><td>${r.margin.toFixed(1)}%</td></tr></tbody></table></div><p class="muted" style="margin-top:12px">Formula: Revenue − (Units Sold × Landed Unit Cost) − Outbound Logistics = True Profit.</p>`;

  const stage5PreviousInventory=pages.inventory;
  pages.inventory=function(){return stage5PreviousInventory()+stage5InventorySection()};

  const stage5PreviousCommand=pages.command;

  };

  renderNav();
})();

</script>
<script id="bizvisu-cheque-js">(function(){const KEY='bizvisu_cheques';function data(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}function save(x){localStorage.setItem(KEY,JSON.stringify(x));render()}function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}function render(){const el=document.getElementById('chequeManagement');if(!el)return;const rows=data();const received=rows.filter(x=>x.direction==='Received'),issued=rows.filter(x=>x.direction==='Issued');const sum=a=>a.reduce((t,x)=>t+Number(x.amount||0),0);el.innerHTML=`<div class="cheque-module"><h2>Cheques & Banking</h2><p>Track customer receipts, supplier payments, PDCs, clearance and bounced cheques.</p><div class="cheque-grid"><div class="cheque-card">Received<br><b>${money(sum(received))}</b></div><div class="cheque-card">Issued<br><b>${money(sum(issued))}</b></div><div class="cheque-card">PDC Value<br><b>${money(sum(rows.filter(x=>x.status==='Post-Dated')))}</b></div><div class="cheque-card">Pending Clearance<br><b>${money(sum(rows.filter(x=>['Deposited','Presentable/Ready'].includes(x.status))))}</b></div><div class="cheque-card">Bounced<br><b>${money(sum(rows.filter(x=>x.status==='Bounced')))}</b></div><div class="cheque-card">Cleared<br><b>${money(sum(rows.filter(x=>x.status==='Cleared')))}</b></div></div><h3 style="margin-top:20px">Add Cheque</h3><form class="cheque-form" id="chequeForm"><input name="party" placeholder="Customer / Supplier" required><select name="direction"><option>Received</option><option>Issued</option></select><input name="invoice" placeholder="Invoice / Bill"><input name="chequeNo" placeholder="Cheque No"><input name="bank" placeholder="Bank"><input name="amount" type="number" step="0.01" placeholder="Amount" required><input name="chequeDate" type="date" required><input name="receivedDate" type="date"><input name="depositDate" type="date"><select name="status"><option>Post-Dated</option><option>Presentable/Ready</option><option>Deposited</option><option>Cleared</option><option>Bounced</option><option>Cancelled</option><option>Stopped</option><option>Returned</option><option>Pending</option></select><input name="bounceCharges" type="number" step="0.01" placeholder="Bounce charges"><input name="notes" placeholder="Notes"><button type="submit">Save Cheque</button></form><h3 style="margin-top:24px">Cheque Register</h3><div style="overflow:auto"><table class="cheque-table"><thead><tr><th>Party</th><th>Type</th><th>Cheque</th><th>Amount</th><th>Cheque Date</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td>${x.party||''}<br><small>${x.invoice||''}</small></td><td>${x.direction}</td><td>${x.chequeNo||''}<br><small>${x.bank||''}</small></td><td>${money(x.amount)}</td><td>${x.chequeDate||''}</td><td><span class="cheque-status">${x.status}</span></td><td><button data-bounce="${i}">Bounce</button> <button data-clear="${i}">Clear</button></td></tr>`).join('')||'<tr><td colspan="7">No cheques recorded.</td></tr>'}</tbody></table></div></div>`;el.querySelector('#chequeForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),x=Object.fromEntries(f.entries());x.amount=Number(x.amount||0);x.bounceCharges=Number(x.bounceCharges||0);rows.push(x);save(rows)};el.querySelectorAll('[data-bounce]').forEach(b=>b.onclick=()=>{rows[+b.dataset.bounce].status='Bounced';rows[+b.dataset.bounce].bounceDate=new Date().toISOString().slice(0,10);save(rows)});el.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{rows[+b.dataset.clear].status='Cleared';rows[+b.dataset.clear].clearanceDate=new Date().toISOString().slice(0,10);save(rows)});}window.BIZVISUCheques={render};document.addEventListener('DOMContentLoaded',render);})();</script><script>function addComplianceTask(){const name=prompt("Compliance name (e.g. GST Return)");if(!name)return;const type=prompt("Type: GST / TDS / PF / ESI / ITR");const due=prompt("Due date YYYY-MM-DD");const key="bizvisu_compliance";let rows=JSON.parse(localStorage.getItem(key)||"[]");rows.push({name,type:type||"Other",period:"Custom",due:due||"",status:"Pending",owner:"Finance"});localStorage.setItem(key,JSON.stringify(rows));openPage("compliance")}function markCompliance(i){const key="bizvisu_compliance";let rows=JSON.parse(localStorage.getItem(key)||"[]");if(rows[i]){rows[i].status="Filed";rows[i].completedAt=new Date().toISOString().slice(0,10);localStorage.setItem(key,JSON.stringify(rows));openPage("compliance")}}</script>

          <div class="bv-exec-card"><div class="eyebrow">BIZVISU PULSE</div><h3>${pulse}/100</h3><p>Executive health signal built from finance, cash, sales and operational evidence.</p></div>

    const current=document.querySelector(".nav button.active")?.id?.replace(/^n-/,'')||"command";
    openPage(roles[state.role]?.access.includes(current)?current:"command");
  }
})();
</script>

<script id="bizvisu-role-subscription-assumptions-final">
(function(){
  "use strict";

  /* =========================
     PLAN ENTITLEMENTS
     Manual business data is never locked. Intelligence depth, automation and scale are.
     ========================= */
  const PLANS={
    Free:{rank:0,price:"₹0",users:1,branches:1,ai:20,features:[
      "command","finance","sales","purchases","inventory","customers","suppliers","reports","settings","documents"
    ]},
    Starter:{rank:1,price:"₹699/mo",users:3,branches:2,ai:100,features:[
      "command","finance","compliance","sales","purchases","inventory","customers","suppliers","operations","logistics","reports","alerts","datahub","settings","documents","analytics"
    ]},
    Business:{rank:2,price:"₹1,499/mo",users:10,branches:5,ai:500,features:[
      "command","finance","compliance","sales","purchases","inventory","customers","suppliers","operations","logistics","hr","labour","insights","analytics","alerts","reports","ai","datahub","settings","documents","intelligence_basic","forecasting_basic"
    ]},
    "Intelligence Pro":{rank:3,price:"₹2,999/mo",users:25,branches:10,ai:2500,features:[
      "command","finance","compliance","sales","purchases","inventory","customers","suppliers","operations","logistics","hr","labour","insights","analytics","alerts","reports","ai","datahub","settings","documents","intelligence_basic","intelligence_pro","forecasting_basic","forecasting_pro","business_memory","anomaly","opportunity","whatif","cash_predictor"
    ]},
    Enterprise:{rank:4,price:"Custom",users:999999,branches:999999,ai:999999,features:["*"]}
  };
  window.BIZVISU_PLANS=PLANS;

  const PAGE_FEATURE={
    command:"command",finance:"finance",compliance:"compliance",sales:"sales",purchases:"purchases",inventory:"inventory",customers:"customers",suppliers:"suppliers",operations:"operations",logistics:"logistics",hr:"hr",labour:"labour",insights:"insights",analytics:"analytics",alerts:"alerts",reports:"reports",ai:"ai",datahub:"datahub",settings:"settings",documents:"documents",users:"users",setup:"setup",subscription:"subscription",
    intelligence:"intelligence_basic",forecasting:"forecasting_basic"
  };

  const ASSUMPTION_DEFAULTS={
    finance:{monthlyRevenue:1800000,grossMargin:22,monthlyExpenses:320000,bankBalance:850000,receivableDays:38,payableDays:30,taxRate:18},
    sales:{monthlyRevenue:1800000,salesTarget:2200000,monthlyGrowth:6,avgOrderValue:125000,conversionRate:24,returnRate:2},
    purchases:{monthlyPurchase:1100000,supplierPriceInflation:5,leadTimeDays:14,purchaseApprovalRate:92,rawMaterialVariance:3},
    inventory:{openingStockValue:2400000,monthlyDemandUnits:850,reorderPointDays:12,shrinkageRate:1.2,carryingCostRate:14,warehouseCapacity:80},
    customers:{newCustomersMonthly:12,churnRate:2.5,avgCreditLimit:350000,avgCollectionDays:38,customerGrowth:5},
    suppliers:{supplierCount:18,avgCreditDays:30,onTimeRate:91,priceVariance:4,qualityAcceptanceRate:96},
    operations:{monthlyOrders:140,capacityUtilization:74,productivityRate:88,downtimeHours:22,processDelayRate:4},
    logistics:{inboundShipments:28,outboundShipments:46,avgFreight:8500,onTimeDelivery:92,fuelRate:105,avgTransitDays:3},
    hr:{employees:32,attendanceRate:94,attritionRate:2.2,avgSalary:36500,newHiresMonthly:2},
    labour:{labourHours:6200,overtimeHours:380,labourCost:1280000,productivity:87,downtimeHours:22},
    compliance:{gstRate:18,tdsRate:2,filingBufferDays:5,complianceScore:94,pendingFilings:1},
    insights:{trendConfidence:82,attentionThreshold:10,marginWarning:15},
    analytics:{dataCoverage:86,trendConfidence:82,varianceThreshold:8},
    intelligence:{riskThreshold:70,opportunityThreshold:65,anomalySensitivity:75,decisionConfidence:82},
    forecasting:{forecastHorizonMonths:6,demandGrowth:6,costInflation:5,cashBufferDays:30,scenarioConfidence:78},
    datahub:{manualRecords:250,importFrequencyDays:7,validationScore:96,duplicateRate:1.5},
    documents:{documentsCount:320,expiryAlerts:7,retentionYears:7},
    setup:{branches:3,departments:13,warehouses:2},
    users:{activeUsers:3,pendingInvites:0},
    subscription:{trialDays:14},
    command:{businessHealth:78,cashBufferDays:30,criticalAlerts:3}
  };
  window.BIZVISU_ASSUMPTION_DEFAULTS=ASSUMPTION_DEFAULTS;

  function ensureAssumptions(){
    state.assumptions=state.assumptions||{};
    Object.keys(ASSUMPTION_DEFAULTS).forEach(k=>{
      state.assumptions[k]=state.assumptions[k]||{};
      Object.entries(ASSUMPTION_DEFAULTS[k]).forEach(([name,val])=>{
        if(state.assumptions[k][name]===undefined || state.assumptions[k][name]===null || Number.isNaN(Number(state.assumptions[k][name]))) state.assumptions[k][name]=val;
      });
    });
    return state.assumptions;
  }
  ensureAssumptions();
  save();

  function currentPlan(){
    const p=state.subscription?.plan||localStorage.getItem("bizvisu_subscription_plan")||"Business";
    return PLANS[p]?p:"Business";
  }
  function featureAllowed(feature){
    const plan=PLANS[currentPlan()];
    return !!plan && (plan.features.includes("*") || plan.features.includes(feature));
  }
  window.BIZVISU_FEATURE_ALLOWED=featureAllowed;
  window.BIZVISU_CURRENT_PLAN=currentPlan;

  function featureMinimum(feature){
    const names=["Free","Starter","Business","Intelligence Pro","Enterprise"];
    return names.find(n=>PLANS[n].features.includes("*")||PLANS[n].features.includes(feature))||"Enterprise";
  }
  function upgradeMessage(feature){
    const min=featureMinimum(feature);
    const plan=PLANS[currentPlan()];
    return `<div class="modalhead"><h2>Premium feature locked</h2><button class="close" onclick="closeModal()">×</button></div><div class="card" style="background:var(--surface2)"><div class="eyebrow">CURRENT PLAN</div><h2>${currentPlan()}</h2><p class="muted">This capability is not included in your current subscription.</p><span class="bv-plan-chip">Required: ${min}</span></div><div class="card" style="margin-top:12px"><h3>Upgrade to unlock</h3><p class="muted">${min} includes this feature plus the related intelligence, automation and usage allowance.</p><button class="btn primary" onclick="closeModal();openPage('subscription')">View ${min} benefits</button></div>`;
  }
  window.BIZVISU_LOCK=function(feature){
    if(featureAllowed(feature))return false;
    openModalHtml(upgradeMessage(feature));
    return true;
  };

  /* Subscription state follows the selected plan and its default limits. */
  const oldSelect=window.bvSelectPlan;
  window.bvSelectPlan=function(plan){
    if(!PLANS[plan])return;
    state.subscription=state.subscription||{};
    state.subscription.plan=plan;
    state.subscription.price=PLANS[plan].price;
    state.subscription.userLimit=PLANS[plan].users;
    state.subscription.branchLimit=PLANS[plan].branches;
    state.subscription.aiLimit=PLANS[plan].ai;
    state.subscription.status="Active";
    state.subscription.billing=state.subscription.billing||"Monthly";
    state.subscription.renewal=state.subscription.renewal||"2027-10-06";
    state.subscription.users=Math.min(Number(state.subscription.users||3),PLANS[plan].users);
    state.subscription.branches=Math.min(Number(state.subscription.branches||1),PLANS[plan].branches);
    state.subscription.aiUsed=Number(state.subscription.aiUsed||0);
    localStorage.setItem("bizvisu_subscription_plan",plan);
    save();
    if(typeof oldSelect==="function") oldSelect(plan);
    renderNav();
    toast(plan+" plan activated in demo mode");
    openPage("subscription");
  };

  /* Role menu in the top-right corner. Every demo role can be selected and immediately changes the app. */
  function roleMenuHtml(){
    const entries=Object.entries(roles);
    return `<div class="role-menu" id="bvRoleMenu"><div class="role-menu-head"><strong id="bvRoleCurrent">${roles[state.role]?.label||state.role}</strong><span>Switch the active demo role. Permissions, navigation and dashboard scope update immediately.</span></div><div class="role-grid">${entries.map(([k,v])=>`<button class="role-option ${state.role===k?'active':''}" onclick="BIZVISU_SWITCH_ROLE('${k}')"><b>${v.label}</b><small>${v.access.length} role permissions${state.role===k?' · Active':''}</small></button>`).join("")}</div><div style="padding:10px;border-top:1px solid var(--line);font-size:11px;color:var(--ink3)">Subscription locks are applied after role permissions.</div></div>`;
  }
  function mountRoleMenu(){
    if(document.getElementById("bvRoleMenu"))return;
    document.body.insertAdjacentHTML("beforeend",roleMenuHtml());
    const avatar=document.getElementById("avatar");
    if(avatar){
      avatar.title="Switch role";
      avatar.onclick=function(e){e.stopPropagation();const m=document.getElementById("bvRoleMenu");m.classList.toggle("open");};
    }
  }
  window.BIZVISU_SWITCH_ROLE=function(r){
    if(!roles[r]){toast("Role configuration error");return;}
    state.role=r;
    const u=(state.users||[]).find(x=>x.role===r);
    if(u)state.currentUserId=u.id;
    save();
    const m=document.getElementById("bvRoleMenu");if(m)m.classList.remove("open");
    renderNav();
    openPage("command");
    toast("Active role: "+roles[r].label);
  };
  document.addEventListener("click",e=>{const m=document.getElementById("bvRoleMenu"),a=document.getElementById("avatar");if(m?.classList.contains("open")&&!m.contains(e.target)&&e.target!==a)m.classList.remove("open");});

  /* Role-aware + subscription-aware navigation. Locked modules remain visible so users understand what each plan unlocks. */
  const baseRenderNav=window.renderNav;
  window.renderNav=function(){
    const r=roles[state.role]||roles.CEO;
    const side=document.getElementById("sideNav");
    if(side){
      side.innerHTML=nav.filter(x=>r.access.includes(x[0])).map(x=>{
        const feature=PAGE_FEATURE[x[0]]||x[0];
        const locked=!featureAllowed(feature);
        return `<button id="n-${x[0]}" class="${locked?'subscription-locked':''}" onclick="${locked?`BIZVISU_LOCK('${feature}')`:`openPage('${x[0]}')`}">${iconSvg(x[1])}<span>${x[2]}</span>${locked?'<span class="nav-lock">🔒</span>':''}</button>`;
      }).join("");
    }
    const su=document.getElementById("sideUser");if(su)su.textContent=r.label;
    const sc=document.getElementById("sideCompany");if(sc)sc.textContent=state.company?.name||"BIZVISU Demo Company";
    const av=document.getElementById("avatar");if(av){av.textContent=(r.label||state.role).split(/\s|\//)[0].slice(0,1).toUpperCase();av.title=r.label+" · Switch role";} const ta=document.querySelector(".top-actions"); if(ta){let rp=document.getElementById("bvActiveRolePill"); if(!rp){rp=document.createElement("button");rp.id="bvActiveRolePill";rp.className="active-role-pill";rp.type="button";ta.insertBefore(rp,av);} rp.innerHTML=`<div><b>${r.label}</b><span>${currentPlan()} plan · Switch role</span></div>`; rp.onclick=function(){const m=document.getElementById("bvRoleMenu");if(m)m.classList.toggle("open");};}
    const mob=document.getElementById("mobileNav");if(mob)mob.innerHTML=nav.filter(x=>r.access.includes(x[0])).slice(0,5).map(x=>`<button onclick="${featureAllowed(PAGE_FEATURE[x[0]]||x[0])?`openPage('${x[0]}')`:`BIZVISU_LOCK('${PAGE_FEATURE[x[0]]||x[0]}')`}">${iconSvg(x[1])}<span>${x[2]}</span></button>`).join("");
    mountRoleMenu();
    const menu=document.getElementById("bvRoleMenu");if(menu)menu.outerHTML=roleMenuHtml();
  };

  /* Strong final page guard: role permission first, subscription entitlement second. */
  const previousOpen=window.openPage;
  window.openPage=function(page){
    if(page==="cheque"||page==="banking")page="finance";
    const r=roles[state.role];
    if(!r){toast("Role configuration error");return;}
    if(!r.access.includes(page)){toast("Permission denied for "+(nav.find(x=>x[0]===page)?.[2]||page));return;}
    const feature=PAGE_FEATURE[page]||page;
    if(page!=="subscription" && page!=="settings" && page!=="users" && !featureAllowed(feature)){
      openModalHtml(upgradeMessage(feature));
      return;
    }
    return previousOpen(page);
  };

  /* =========================
     ASSUMPTION DATA CENTER
     Every business head gets editable manual assumptions. These values are deliberately
     demo assumptions for trends until real company data is entered.
     ========================= */
  function assumptionLabel(key){return key.replace(/([A-Z])/g," $1").replace(/^./,x=>x.toUpperCase());}
  function assumptionInput(module,key,val){
    const isText=false;
    return `<div class="field"><label>${assumptionLabel(key)}</label><input type="number" step="0.01" value="${Number(val)}" onchange="BIZVISU_UPDATE_ASSUMPTION('${module}','${key}',this.value)"></div>`;
  }
  window.BIZVISU_UPDATE_ASSUMPTION=function(module,key,value){
    ensureAssumptions();
    const n=Number(value);
    if(!Number.isFinite(n))return;
    state.assumptions[module][key]=n;
    state.assumptions._lastUpdated={module,key,at:new Date().toISOString()};
    save();
    toast(assumptionLabel(key)+" updated");
  };
  window.BIZVISU_RESET_ASSUMPTIONS=function(module){
    if(!ASSUMPTION_DEFAULTS[module])return;
    state.assumptions[module]={...ASSUMPTION_DEFAULTS[module]};save();toast(module+" assumptions reset to demo baseline");openPage(module==="command"?"command":module);
  };
  function assumptionCard(module,title){
    ensureAssumptions();
    const a=state.assumptions[module]||{};
    const entries=Object.entries(a).filter(([k,v])=>k!=="_lastUpdated");
    if(!entries.length)return "";
    return `<div class="card assumption-card" style="margin-top:16px"><div class="section-title"><div><h3>${title||assumptionLabel(module)} Assumptions</h3><span>Demo assumptions drive trends until real manual data is entered.</span></div><button class="btn small" onclick="BIZVISU_RESET_ASSUMPTIONS('${module}')">Reset demo values</button></div><div class="grid g4">${entries.map(([k,v])=>assumptionInput(module,k,v)).join("")}</div><div class="assumption-note">Source status: <b>Assumption / Manual Input</b>. These are not actual company records.</div></div>`;
  }
  window.BIZVISU_ASSUMPTION_CARD=assumptionCard;

  /* Add an editable assumption block to every module head without replacing existing module data. */
  const wrapped={};
  const modules=["command","finance","compliance","sales","purchases","inventory","customers","suppliers","operations","logistics","hr","labour","insights","analytics","intelligence","forecasting","datahub","documents","setup","users"];
  modules.forEach(module=>{
    const fn=pages[module];
    if(typeof fn!=="function" || wrapped[module])return;
    wrapped[module]=fn;
    pages[module]=function(){
      const base=fn();
      return base+assumptionCard(module,nav.find(x=>x[0]===module)?.[2]||module);
    };
  });

  /* A dedicated manual-input page is available through Data Hub for all assumptions. */
  const oldDatahub=pages.datahub;
  if(typeof oldDatahub==="function"){
    pages.datahub=function(){
      const base=oldDatahub();
      const cards=Object.keys(ASSUMPTION_DEFAULTS).map(m=>`<div class="card"><div class="eyebrow">${m.toUpperCase()}</div><h3>${assumptionLabel(m)} assumptions</h3><p class="muted">${Object.keys(ASSUMPTION_DEFAULTS[m]).length} editable inputs · currently demo assumptions.</p><button class="btn" onclick="openPage('${m==='command'?'command':m}')">Edit inputs</button></div>`).join("");
      return base+`<div class="section-title" style="margin-top:18px"><h2>Manual Assumptions & Trend Inputs</h2><span>Replace assumptions with real business data later.</span></div><div class="grid g4">${cards}</div>`;
    };
  }

  /* Subscription page: full plan benefits and upcoming-feature roadmap with lock level. */
  pages.subscription=function(){
    const s=state.subscription||{};const active=currentPlan();
    const rows=[
      ["Manual business data","✓","✓","✓","✓","✓"],
      ["Core Finance / Sales / Purchase / Inventory","✓","✓","✓","✓","✓"],
      ["Customers & Suppliers","✓","✓","✓","✓","✓"],
      ["Basic Reports","✓","✓","✓","✓","✓"],
      ["Compliance + Logistics","—","✓","✓","✓","✓"],
      ["Operations + HR + Labour","—","—","✓","✓","✓"],
      ["Advanced Analytics","—","Basic","Advanced","Advanced","Advanced"],
      ["Smart Alerts","—","Basic","✓","✓","✓"],
      ["BIZVISU AI","—","—","✓","✓","✓"],
      ["Business Doctor / Risk Radar","—","—","Basic","✓","✓"],
      ["Forecasting & Scenarios","—","—","Basic","Advanced","Advanced"],
      ["Anomaly Detective","—","—","—","✓","✓"],
      ["Opportunity Engine","—","—","—","✓","✓"],
      ["What-if Simulator","—","—","—","✓","✓"],
      ["Business Memory","—","—","—","✓","✓"],
      ["Cash Flow Predictor","—","—","—","✓","✓"],
      ["API / SSO / Advanced Integrations","—","—","—","—","✓"],
      ["Dedicated Enterprise Support","—","—","—","—","✓"]
    ];
    const planCard=(name,cls="")=>{const p=PLANS[name];return `<div class="card ${cls}" style="height:100%"><div class="eyebrow">${name.toUpperCase()}</div><h2>${p.price}</h2><p class="muted">${name==='Free'?'Start with core business records.':name==='Starter'?'Connect more operations and compliance.':name==='Business'?'Run the complete SME management layer.':name==='Intelligence Pro'?'Unlock advanced decision intelligence.':'Custom scale, security and integrations.'}</p><div style="margin:10px 0"><span class="bv-plan-chip">${p.users>=999999?'Unlimited':p.users} users</span> <span class="bv-plan-chip">${p.branches>=999999?'Unlimited':p.branches} branches</span> <span class="bv-plan-chip">${p.ai>=999999?'Unlimited':p.ai} AI</span></div><button class="btn ${active===name?'primary':''}" onclick="bvSelectPlan('${name}')">${active===name?'Current plan':'Select '+name}</button></div>`};
    return head("SUBSCRIPTION & ENTITLEMENT","BIZVISU Subscription & Entitlement","Choose what your business gets today and see what future capabilities unlock at each level.")+
      `<div class="card"><div class="grid g4">${kpi("Current Plan",active,s.status||"Active","good")}${kpi("Users",s.users||3,(s.users||3)+" / "+(s.userLimit||PLANS[active].users),"neutral")}${kpi("Branches",s.branches||1,(s.branches||1)+" / "+(s.branchLimit||PLANS[active].branches),"neutral")}${kpi("AI Usage",s.aiUsed||0,(s.aiUsed||0)+" / "+(s.aiLimit||PLANS[active].ai),"neutral")}</div></div>`+
      `<div class="grid g4" style="margin-top:14px">${planCard('Free')}${planCard('Starter')}${planCard('Business','subscription-featured')}${planCard('Intelligence Pro')}${planCard('Enterprise')}</div>`+
      `<div class="card" style="margin-top:16px"><h3>Plan comparison</h3><p class="muted">Core business data stays accessible. Premium plans unlock intelligence, automation, forecasting, AI and scale.</p><div class="table-wrap"><table><thead><tr><th>Capability</th><th>Free</th><th>Starter</th><th>Business</th><th>Intelligence Pro</th><th>Enterprise</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>i===0?`<th>${c}</th>`:`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`+
      `<div class="card" style="margin-top:16px"><h3>Upcoming feature locks</h3><div class="grid g4"><div><b>Business</b><p class="muted">Advanced analytics, AI, HR, operations, alerts and basic forecasting.</p></div><div><b>Intelligence Pro</b><p class="muted">Business Memory, Anomaly Detective, Opportunity Engine, What-if, Risk Radar and Cash Predictor.</p></div><div><b>Enterprise</b><p class="muted">API, SSO, advanced integrations, unlimited scale and enterprise controls.</p></div><div><b>Manual Data</b><p class="muted">Manual entry remains available; subscription controls intelligence and scale, not ownership of your data.</p></div></div></div>`;
  };

  /* Keep subscription visible to CEO/CFO/Admin, but locked for other roles unless explicitly allowed. */
  roles.CEO.access=[...new Set([...roles.CEO.access,"subscription"])];
  roles.CFO.access=[...new Set([...roles.CFO.access,"subscription"])];
  roles.ADMIN.access=[...new Set([...roles.ADMIN.access,"subscription"])];

  /* Final render and role-menu mount. */
  renderNav();
  mountRoleMenu();
  ensureAssumptions();
  save();
})();
</script>

    ["inventorybizvisu@1031","inventory@1031","U008","Inventory Manager","IM","Inventory","Branch B"],
    ["logisticsbizvisu@1031","logistics@1031","U009","Logistics Manager","LM","Logistics","Branch B"],
    ["hrbizvisu@1031","hr@1031","U010","HR Manager","HRM","HR","All Company"],
    ["payrollbizvisu@1031","payroll@1031","U011","Payroll Executive","PAY","Payroll","All Company"],
    ["manufacturingbizvisu@1031","manufacturing@1031","U012","Manufacturing Manager","MM","Manufacturing","Branch C"],
    ["operationsbizvisu@1031","operations@1031","U013","Operations Manager","OM","Operations","All Company"],
    ["compliancebizvisu@1031","compliance@1031","U014","Compliance Manager","CM","Compliance","All Company"],
    ["adminbizvisu@1031","admin@1031","U015","System Administrator","ADMIN","Administration","All Company"]
  ];

  function bvFindDemo(id,pw){
    return BV_DEMO_ACCOUNTS.find(a => a[0].toLowerCase()===id && a[1]===pw) || null;
  }

  function bvShowError(msg){
    const el=document.getElementById("loginError");
    if(el){el.textContent=msg;el.style.display="block";}
  }

  window.loginUser=function(){
    const id=(document.getElementById("loginId")?.value||"").trim().toLowerCase();
    const pw=document.getElementById("loginPassword")?.value||"";
    if(!id || !pw){bvShowError("Enter your Login ID and Password.");return;}

    let u=null;
    try{
      if(typeof state!=="undefined"){
        state.users=Array.isArray(state.users)?state.users:[];
        u=state.users.find(x=>(x.email||"").toLowerCase()===id && x.password===pw && x.status!=="Inactive");
      }
    }catch(e){ /* use deterministic demo fallback below */ }

    // Always allow the documented prototype/demo accounts even when an old
    // localStorage record is missing or stale.
    const d=bvFindDemo(id,pw);
    if(!u && d){
      u={
        id:d[2],name:d[3],email:d[0],password:d[1],
        role:d[4],department:d[5],designation:d[3],
        branch:d[6],manager:"BIZVISU CEO",status:"Active",lastLogin:"—"
      };
      try{
        if(typeof state!=="undefined"){
          const existing=state.users.find(x=>(x.email||"").toLowerCase()===id || x.id===d[2]);
          if(existing) Object.assign(existing,u); else state.users.push(u);
        }
      }catch(e){}
    }

    if(!u){
      const demo=bvFindDemo(id,pw);
      bvShowError(demo ? "Login could not be completed. Please try again." : "Incorrect Login ID or Password.");
      return;
    }

    try{
      state.logged=true;
      state.currentUserId=u.id;
      state.role=u.role;
      state.branch=u.branch||"All Company";
      u.lastLogin=new Date().toISOString().slice(0,16).replace("T"," ");
      state.audit=Array.isArray(state.audit)?state.audit:[];
      state.audit.unshift({
        at:new Date().toISOString(),
        user:u.name,
        action:"Login",
        target:u.email,
        department:u.department
      });
      try{save();}catch(e){}

      const login=document.getElementById("login");
      const app=document.getElementById("app");
      if(login) login.style.display="none";
      if(app) app.style.display="grid";

      try{if(typeof renderNav==="function")renderNav();}catch(e){}
      try{if(typeof openPage==="function")openPage("command");}catch(e){
        const content=document.getElementById("content");
        if(content){
          content.innerHTML="<div class='card' style='padding:24px'><h2>Welcome to BIZVISU</h2><p>Login successful. The command center is loading.</p></div>";
        }
      }
      try{if(typeof toast==="function")toast("Welcome to BIZVISU, "+u.name);}catch(e){}
    }catch(e){
      // Authentication succeeded even if a non-authentication UI routine fails.
      const login=document.getElementById("login");
      const app=document.getElementById("app");
      if(login)login.style.display="none";
      if(app)app.style.display="grid";
      bvShowError("Login succeeded, but the dashboard had a loading error. Refresh the page and sign in again.");
      console.error("BIZVISU post-login error:",e);
    }
  };

  // Prevent Enter from accidentally submitting/reloading the page.
  document.addEventListener("keydown",function(e){
    if(e.key==="Enter" && document.activeElement &&
       (document.activeElement.id==="loginId" || document.activeElement.id==="loginPassword")){
      e.preventDefault();
      window.loginUser();
    }
  });

  window.BIZVISU_LOGIN_TEST=function(){
    const results=BV_DEMO_ACCOUNTS.map(a=>{
      let pass=false;
      try{
        const d=bvFindDemo(a[0],a[1]);
        pass=!!d && d[4];
      }catch(e){}
      return {login:a[0],role:a[4],pass};
    });
    return {total:results.length,passed:results.filter(x=>x.pass).length,results};
  };
})();
</script>
